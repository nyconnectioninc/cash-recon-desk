<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cash Recon">
<title>Cash Recon Desk</title>
<!--ICON-->
<style>
:root{
  --bg:#f2f2f7; --surface:#ffffff; --surface-2:#f7f7fa; --fill:rgba(118,118,128,.12);
  --fg:#1c1c1e; --muted:#6e6e73; --faint:#aeaeb2; --sep:rgba(60,60,67,.16);
  --accent:#007aff; --green:#34c759; --orange:#ff9500; --red:#ff3b30; --purple:#af52de; --teal:#30b0c7; --indigo:#5856d6;
  --material:rgba(246,246,250,.78); --shadow:0 10px 40px rgba(0,0,0,.12);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace; --r-lg:14px; --r-md:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000; --surface:#1c1c1e; --surface-2:#2c2c2e; --fill:rgba(118,118,128,.24);
  --fg:#f5f5f7; --muted:#98989d; --faint:#636366; --sep:rgba(84,84,88,.55);
  --accent:#0a84ff; --green:#30d158; --orange:#ff9f0a; --red:#ff453a; --purple:#bf5af2; --teal:#40c8e0; --indigo:#5e5ce6;
  --material:rgba(28,28,30,.78); --shadow:0 10px 40px rgba(0,0,0,.55); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000; --surface:#1c1c1e; --surface-2:#2c2c2e; --fill:rgba(118,118,128,.24);
  --fg:#f5f5f7; --muted:#98989d; --faint:#636366; --sep:rgba(84,84,88,.55);
  --accent:#0a84ff; --green:#30d158; --orange:#ff9f0a; --red:#ff453a; --purple:#bf5af2; --teal:#40c8e0; --indigo:#5e5ce6;
  --material:rgba(28,28,30,.78); --shadow:0 10px 40px rgba(0,0,0,.55); color-scheme:dark}
/*LOGO*/
*{box-sizing:border-box}
html,body{height:100%;margin:0}
html,body{overflow-x:hidden}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
select,input,textarea{font:inherit;color:var(--fg)}
html,body{max-width:100%;overflow-x:hidden}
@media (max-width:760px){select,input,textarea{font-size:16px}}
:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}

.app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;overflow:auto;background:var(--material);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  border-right:1px solid var(--sep);padding:20px 12px;display:flex;flex-direction:column;gap:18px}
.nyc-logo{display:block;background:var(--fg);-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat;aspect-ratio:520/211;flex:none}
.brand{display:flex;flex-direction:column;gap:8px;padding:4px 10px 2px}
.brand .nyc-logo{width:140px}
.brand-sub{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.02em}
.nav-h{font-size:12px;font-weight:600;color:var(--muted);padding:0 10px 6px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:9px;text-align:left;width:100%}
.nav button:hover{background:var(--fill)}
.nav button[aria-current="page"]{background:var(--accent);color:#fff}
.nav button[aria-current="page"] .cnt{color:rgba(255,255,255,.85)}
.nav .lbl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cnt{font-size:13px;color:var(--muted)}
.cnt.bad{color:var(--red);font-weight:600}
.ico{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;color:#fff;flex:none}
.ico svg{width:15px;height:15px}
.side-foot{margin-top:auto;padding:10px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:8px}

main{min-width:0;padding:28px max(16px,env(safe-area-inset-right,0px)) 64px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.wrap>*{min-width:0}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.eyebrow{font-size:13px;font-weight:600;color:var(--muted)}
h1{font-size:34px;line-height:1.1;letter-spacing:-.025em;margin:2px 0 0;font-weight:700}
h2{font-size:20px;letter-spacing:-.015em;margin:0;font-weight:650}
h3{font-size:15px;margin:0;font-weight:650}
.sub{color:var(--muted);margin:4px 0 0}
.banner{background:color-mix(in srgb,var(--orange) 13%,var(--surface));border-radius:var(--r-lg);padding:10px 14px;font-size:14px}

.daynav{display:flex;align-items:center;gap:6px}
.iconbtn{width:34px;height:34px;border-radius:50%;background:var(--fill);display:grid;place-items:center;color:var(--accent)}
.iconbtn[disabled]{opacity:.35;cursor:default}
.iconbtn svg{width:16px;height:16px}
.datesel{background:var(--fill);border:0;border-radius:999px;padding:7px 12px;font-weight:600}

.tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.tile{background:var(--surface);border-radius:var(--r-lg);padding:14px;display:flex;flex-direction:column;gap:8px;text-align:left;border:2px solid transparent}
.tile:hover{box-shadow:0 0 0 1px var(--sep)}
.tile[aria-pressed="true"]{border-color:var(--accent)}
.tile .big{font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1}
.tile .lab{font-weight:600;font-size:14px;display:flex;align-items:center;gap:6px}
.tile .meta{font-size:12px;color:var(--muted)}
.sw{width:9px;height:9px;border-radius:3px;flex:none}

.card{background:var(--surface);border-radius:var(--r-lg);padding:14px}
.trend{display:flex;flex-direction:column;gap:8px}
.trend-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.trend svg{width:100%;height:84px;display:block;overflow:visible}
.trend .legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.trend .legend span{display:inline-flex;align-items:center;gap:5px}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;background:var(--fill);border-radius:9px;padding:2px;gap:2px;flex-wrap:wrap}
.seg button{padding:5px 12px;border-radius:7px;font-size:13px;font-weight:500;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.search{flex:1;min-width:180px;display:flex;align-items:center;gap:6px;background:var(--fill);border-radius:10px;padding:7px 10px}
.search input{border:0;background:none;outline:0;width:100%}
.search svg{width:15px;height:15px;color:var(--muted);flex:none}
.pick{background:var(--fill);border:0;border-radius:10px;padding:7px 10px;max-width:200px}

.tbl{background:var(--surface);border-radius:var(--r-lg);overflow:hidden}
.th,.tr{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) 92px 92px 92px 150px;gap:12px;align-items:center;padding:10px 14px}
.th{font-size:12px;font-weight:600;color:var(--muted);box-shadow:inset 0 -1px 0 var(--sep)}
.th .r,.tr .r{text-align:right}
.tr{width:100%;text-align:left;cursor:pointer}
.tr+.tr{box-shadow:inset 0 1px 0 var(--sep)}
.tr:hover{background:var(--surface-2)}
.tr.sel{background:color-mix(in srgb,var(--accent) 12%,var(--surface))}
.st{min-width:0}
.st b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.st small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dm{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.neg{color:var(--red)} .pos{color:var(--purple)}
.cell-st{display:flex;justify-content:flex-end;gap:6px;align-items:center}
.pill{font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.p-missing{background:color-mix(in srgb,var(--red) 16%,transparent);color:var(--red)}
.p-short{background:color-mix(in srgb,var(--orange) 18%,transparent);color:var(--orange)}
.p-over{background:color-mix(in srgb,var(--purple) 16%,transparent);color:var(--purple)}
.p-bonly{background:color-mix(in srgb,var(--teal) 18%,transparent);color:var(--teal)}
.p-minor{background:var(--fill);color:var(--muted)}
.p-ok{background:color-mix(in srgb,var(--green) 18%,transparent);color:var(--green)}
.p-none{background:none;color:var(--faint)}
.adjdot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none}
.empty{padding:36px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-size:16px;margin-bottom:4px}
.group-h{display:flex;justify-content:space-between;align-items:baseline;padding:0 4px;gap:8px;margin-bottom:8px}
.group-h span{font-size:13px;color:var(--muted)}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.32);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(480px,100%);z-index:50;background:var(--bg);box-shadow:var(--shadow);
  transform:translateX(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
.sheet.on{transform:none}
.sh-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 6px;gap:8px}
.sh-body{overflow:auto;padding:4px 16px 28px;display:flex;flex-direction:column;gap:16px}
.sh-body>*{flex-shrink:0}
.kv{background:var(--surface);border-radius:var(--r-lg);overflow:hidden}
.kv-row{display:grid;grid-template-columns:110px minmax(0,1fr);gap:10px;padding:9px 12px;position:relative;align-items:start}
.kv-row+.kv-row::before{content:"";position:absolute;top:0;left:12px;right:0;border-top:1px solid var(--sep)}
.kv-k{color:var(--muted);font-size:13px;padding-top:1px}
.kv-v{overflow-wrap:anywhere}
.mini{background:var(--surface);border-radius:var(--r-lg);overflow:hidden;font-size:13px}
.mini-r{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:8px 12px}
.mini-r+.mini-r{box-shadow:inset 0 1px 0 var(--sep)}
.mini-r small{color:var(--muted);grid-column:1/-1}
.hist{display:flex;gap:3px;align-items:flex-end;height:44px;padding:4px 0}
.hist i{flex:1;border-radius:2px;min-height:3px;cursor:pointer}
.form{background:var(--surface);border-radius:var(--r-lg);padding:12px;display:flex;flex-direction:column;gap:10px}
.form label{font-size:13px;color:var(--muted);font-weight:600;display:flex;flex-direction:column;gap:5px}
.form input,.form select,.form textarea{border:1px solid var(--sep);background:var(--surface-2);border-radius:10px;padding:9px 10px;outline:0}
.form textarea{min-height:64px;resize:vertical}
.form .row2{display:grid;grid-template-columns:140px minmax(0,1fr);gap:10px}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{font-size:12px;padding:4px 9px;border-radius:999px;background:var(--fill);color:var(--accent);font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;border-radius:999px;background:var(--fill);color:var(--accent);font-weight:600;font-size:14px;white-space:nowrap}
.btn.primary{background:var(--accent);color:#fff}
.btn[disabled]{opacity:.45;cursor:default}
.err{color:var(--red);font-size:13px;min-height:1em}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:999px;font-weight:600;font-size:14px;opacity:0;transition:.2s;z-index:60;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* Login */
.login{min-height:100%;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;padding:40px 16px}
.login-card{width:min(380px,100%);min-width:0;overflow-wrap:anywhere;background:var(--surface);border-radius:20px;padding:28px 24px;display:flex;flex-direction:column;gap:16px;box-shadow:var(--shadow)}
.login-card .nyc-logo{width:150px}
.login-card h1{font-size:26px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;color:var(--muted);font-weight:600}
.field input{font-size:17px;padding:12px 14px;border-radius:12px;border:1px solid var(--sep);background:var(--surface-2);outline:0}
.field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.field input.code{letter-spacing:.4em;text-align:center;font-size:24px;font-variant-numeric:tabular-nums}
.fine{font-size:13px;color:var(--muted);margin:0}

.mbar{display:none}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  main{padding-top:12px}
  .mbar{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px 4px}
  .mbar::-webkit-scrollbar{display:none}
  .mbar button{background:var(--surface);border-radius:999px;padding:7px 14px;white-space:nowrap;font-weight:500;font-size:14px}
  .mbar button[aria-current="page"]{background:var(--accent);color:#fff}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tiles .tile:first-child{grid-column:1/-1}
  h1{font-size:28px}
  .th{display:none}
  .tr{grid-template-columns:minmax(0,1fr) auto;gap:2px 10px}
  .tr .dm,.tr .c-rq,.tr .c-br{display:none}
  .tr .c-diff{grid-row:2;grid-column:2;font-size:13px}
  .tr .cell-st{grid-row:1;grid-column:2}
  .tr .st{grid-row:1/3}
  .sheet{top:auto;left:0;width:100%;height:92%;border-radius:14px 14px 0 0;transform:translateY(105%)}
  .pick{max-width:150px}
}
/* v2 */
.tiles.t4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:860px){.tiles.t4{grid-template-columns:repeat(2,minmax(0,1fr))}.tiles.t4 .tile:first-child{grid-column:auto}}
.mtheme{display:none}
.theme-seg button{padding:4px 10px;font-size:12px}
@media (max-width:860px){.mtheme{display:flex;justify-content:flex-end;margin-top:-8px}}
.p-combo{background:color-mix(in srgb,var(--indigo) 16%,transparent);color:var(--indigo)}
.lockbar{display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--surface);border-radius:var(--r-lg);padding:10px 14px;font-size:14px;color:var(--muted);flex-wrap:wrap}
.lockbar.on{background:color-mix(in srgb,var(--accent) 10%,var(--surface));color:var(--fg)}
.suggest{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:color-mix(in srgb,var(--green) 12%,var(--surface-2));border-radius:10px;padding:10px;font-size:13px}
.days{display:flex;flex-direction:column;gap:6px}
.days label{flex-direction:row!important;align-items:center;gap:8px!important;color:var(--fg)!important;font-weight:500!important;font-size:14px!important}
.days.dow{flex-direction:row;flex-wrap:wrap;gap:12px}
.chip{background:var(--fill);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:500}
.th.safe-g,.tr.safe-g{grid-template-columns:minmax(0,1.5fr) 150px 50px 100px 80px minmax(110px,.8fr) minmax(120px,1fr)}
.meter{display:flex;flex-direction:column;gap:3px}
.meter i{display:block;height:6px;border-radius:3px;max-width:100%}
.meter{background:none}
.meter::before{content:"";display:block;height:6px;border-radius:3px;background:var(--fill);margin-bottom:-9px}
.meter small{font-size:11px;color:var(--muted)}
.tr.score-g{grid-template-columns:minmax(0,1.3fr) minmax(120px,1fr) 40px minmax(0,1.3fr)}
.sbar{display:flex;height:8px;border-radius:4px;background:var(--fill);overflow:hidden}
.sbar i{display:block;height:100%}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .dow{font-size:12px;color:var(--muted);font-weight:600;text-align:center}
.cal-d{position:relative;aspect-ratio:1.7;border-radius:10px;background:color-mix(in srgb,var(--c,var(--fill)) 18%,var(--surface-2));border-left:3px solid var(--c,transparent);text-align:left;padding:6px 7px;display:flex;flex-direction:column;justify-content:space-between;min-width:0}
.cal-d b{font-size:13px}.cal-d small{font-size:11px;color:var(--c,var(--muted));font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-d.none{opacity:.45;cursor:default;background:var(--surface-2)}
.cal-d .lk{position:absolute;top:4px;right:5px;font-size:10px;font-style:normal}
.req{display:flex;gap:14px;align-items:center;justify-content:space-between;padding:12px 14px;flex-wrap:wrap}
.req+.req{box-shadow:inset 0 1px 0 var(--sep)}
.req .st{flex:1;min-width:220px}
.req-a{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.req-a select,.req-a input{border:1px solid var(--sep);background:var(--surface-2);border-radius:10px;padding:7px 9px;min-width:0}
.perm .pr{display:grid;grid-template-columns:minmax(0,2fr) repeat(5,minmax(0,1fr));gap:8px;padding:9px 14px;font-size:13px;align-items:center}
.perm .pr+.pr{box-shadow:inset 0 1px 0 var(--sep)}
.perm .ph{font-weight:600;color:var(--muted);font-size:12px}
.perm .yes{color:var(--green);font-weight:700}.perm .no{color:var(--faint)}.perm .part{color:var(--accent);font-weight:600}
@media (max-width:860px){
  .th.safe-g{display:none}
  .tr.safe-g{grid-template-columns:minmax(0,1fr) auto}
  .tr.safe-g>span:nth-child(3),.tr.safe-g>span:nth-child(5){display:none}
  .tr.safe-g>span:nth-child(1){grid-column:1;grid-row:1}
  .tr.safe-g>span:nth-child(4){grid-column:2;grid-row:1}
  .tr.safe-g>span:nth-child(2){grid-column:1;grid-row:2;display:block}
  .tr.safe-g>span:nth-child(6){grid-column:2;grid-row:2;justify-content:flex-end!important}
  .tr.safe-g>span:nth-child(7){grid-column:1/-1;grid-row:3}
  .tr.score-g{grid-template-columns:minmax(0,1fr) 40px}
  .tr.score-g .sbar,.tr.score-g .dm{grid-column:1/-1}
  .tr.score-g .dm{display:block}
  .perm .pr{grid-template-columns:minmax(0,1.6fr) repeat(5,minmax(0,1fr));font-size:11px;padding:8px 10px;gap:4px}
  .cal-d{aspect-ratio:auto;min-height:48px;padding:4px}
  .cal-d small{font-size:9px}
}
@media (prefers-reduced-motion:reduce){.sheet,.scrim,.toast{transition:none}}
</style>
</head>
<body>
<div id="root"></div>
<div class="scrim" id="scrim"></div>
<aside class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-t"></aside>
<div class="toast" id="toast" role="status"></div>
<script>
const API_URL = "https://script.google.com/macros/s/AKfycbxam-F_3keAk2SmdAxlfKPFAqY-6LLxfGVT_yR3nqXU0IpoSP5UsMVOhexhN2cwZq8Tcg/exec";
const TOKEN_KEY = "crd.session";
const THEME_KEY = "crd.theme";
function getTheme(){ try{ return localStorage.getItem(THEME_KEY)||"light"; }catch(e){ return "light"; } }
function applyTheme(t){ if(t==="auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme",t); }
function setTheme(t){ try{ localStorage.setItem(THEME_KEY,t); }catch(e){} applyTheme(t); document.querySelectorAll("[data-theme-set]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.themeSet===t)); }
function themeSeg(){ const t=getTheme(); return `<div class="seg theme-seg" role="group" aria-label="Appearance">${[["light","Light"],["dark","Dark"],["auto","Auto"]].map(([k,l])=>`<button type="button" data-theme-set="${k}" aria-pressed="${t===k}">${l}</button>`).join("")}</div>`; }
document.addEventListener("click",e=>{ const b=e.target.closest&&e.target.closest("[data-theme-set]"); if(b) setTheme(b.dataset.themeSet); });
applyTheme(getTheme());

const STATUS = {
  "MISSING DEPOSIT":{cls:"p-missing",label:"Missing deposit",color:"var(--red)",open:1},
  "SHORT":{cls:"p-short",label:"Short",color:"var(--orange)",open:1},
  "OVER":{cls:"p-over",label:"Over",color:"var(--purple)",open:1},

const S = { token:null, me:null, boot:null, days:{}, view:"day", date:null, filter:"open", q:"", dm:"", co:"", sel:null, store:null, users:null, loading:false, err:null };
const $ = id => document.getElementById(id);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = (n,sign) => { n=Number(n)||0; const s=Math.abs(n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2}); return (n<0?"−$":(sign&&n>0?"+$":"$"))+s; };
const dayLabel = (d,long) => { const x=new Date(d+"T12:00:00"); return x.toLocaleDateString("en-US",long?{weekday:"long",month:"long",day:"numeric"}:{weekday:"short",month:"numeric",day:"numeric"}); };
const baseStatus = r => String(r.finalStatus||r.status).replace(/ \(adj\)$/,"");
const isOpen = r => !/RESOLVED/.test(r.finalStatus) && !!(STATUS[baseStatus(r)]||{}).open;
function pill(r){
  const fs=String(r.finalStatus||r.status);
  const ar=String(r.adjReason||"");
  if(/Combined deposit/.test(ar)) return `<span class="pill p-combo">Combined${/RESOLVED/.test(fs)?"":" · "+esc((STATUS[baseStatus(r)]||{}).label||"")}</span>`;
  if(/Matched extra deposit/.test(ar)&&/RESOLVED/.test(fs)) return `<span class="pill p-ok">Matched</span>`;
  if(/RESOLVED \(manual\)/.test(fs)) return `<span class="pill p-ok">Resolved</span>`;
  if(/RESOLVED/.test(fs)) return `<span class="pill p-ok">Late drop · nets $0</span>`;
  const s=STATUS[baseStatus(r)]||{cls:"p-minor",label:fs};
  return `<span class="pill ${s.cls}">${esc(s.label)}${/\(adj\)/.test(fs)?" · adj":""}</span>`;

function toast(m){ const t=$("toast"); t.textContent=m; t.classList.add("on"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("on"),2200); }

/* ---------- API ---------- */
async function api(action,payload){
  if(!/^https:\/\/script\.google\.com\//.test(API_URL)) return {ok:false,error:"not_configured"};
  try{
    const res=await fetch(API_URL,{method:"POST",body:JSON.stringify(Object.assign({action,token:S.token},payload||{}))});
    const j=await res.json();
    if(j && j.error==="signed_out"){ signOut("Your session ended. Sign in again."); }
    return j;
  }catch(e){ return {ok:false,error:"network"}; }
}
const errText = r => ({not_configured:"The dashboard isn't connected to its backend yet.",network:"Couldn't reach the server. Check your connection.",
  read_only:"Your access is view-only.",reason_required:"Add a reason for the adjustment.",bad_amount:"Enter a valid amount.",
  admin_only:"Only admins can do that.",day_locked:"That day is closed. An admin has to reopen it first.",no_extra:"There's no extra amount on this day to move.",
  pick_days:"Pick at least one earlier day.",nothing_to_move:"Those days have nothing open to cover.",not_allowed:"That store isn't in your access.",bad_date:"Pick a valid date.",cant_remove_self:"You can't remove your own admin access.",server_error:"The server hit an error. Try again."})[r&&r.error]||"Something went wrong. Try again.";

/* ---------- session ---------- */
function loadSession(){ try{ const x=JSON.parse(localStorage.getItem(TOKEN_KEY)||"null"); if(x&&x.token&&x.expires>Date.now()){ S.token=x.token; S.me=x.me; } }catch(e){} }
function saveSession(x){ try{ localStorage.setItem(TOKEN_KEY,JSON.stringify(x)); }catch(e){} }
function signOut(msg){ try{ localStorage.removeItem(TOKEN_KEY); }catch(e){} Object.assign(S,{token:null,me:null,boot:null,days:{},users:null}); closeSheet(); renderLogin(null,msg); }

function renderLogin(email,msg){
  $("root").innerHTML=`<div class="login"><form class="login-card" id="lf" data-email="${esc(email||"")}">
    <span class="nyc-logo" role="img" aria-label="NY Connection"></span>
    <div><h1>Cash Recon Desk</h1><p class="fine" style="margin-top:4px">Daily RQ cashout vs. Brinks deposit check.</p></div>
    ${email?`<p class="fine">We emailed a 6-digit code to <b>${esc(email)}</b>. It expires in 10 minutes.</p>
      <div class="field"><label for="l-code">Code</label><input id="l-code" class="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required></div>
      <button class="btn primary" type="submit">Sign in</button><button class="btn" type="button" id="l-back">Use a different email</button>`
    :`<div class="field"><label for="l-email">Work email</label><input id="l-email" type="email" autocomplete="email" required placeholder="name@wireless-zone.com"></div>
      <button class="btn primary" type="submit">Email me a code</button><button class="btn" type="button" id="l-req">Request access</button>`}
    <p class="err" id="l-err" role="alert">${esc(msg||"")}</p><div style="display:flex;justify-content:center">${themeSeg()}</div></form></div>`;
  setTimeout(()=>{ const i=$(email?"l-code":"l-email"); i&&i.focus(); },30);
  const back=$("l-back"); if(back) back.onclick=()=>renderLogin(null);
  const rq=$("l-req"); if(rq) rq.onclick=()=>renderRequest();
  $("lf").onsubmit=async ev=>{
    ev.preventDefault(); const f=$("lf"), btn=f.querySelector(".btn.primary"), err=$("l-err"); err.textContent="";
    if(!f.dataset.email){
      const em=$("l-email").value.trim(); btn.disabled=true; btn.textContent="Sending…";
      const r=await api("requestCode",{email:em});
      if(!r.ok){ btn.disabled=false; btn.textContent="Email me a code"; err.textContent=r.error==="bad_email"?"Enter a valid email.":errText(r); return; }
      renderLogin(em);
    }else{
      const code=$("l-code").value.replace(/\D/g,""); if(code.length!==6){ err.textContent="Enter the 6-digit code."; return; }
      btn.disabled=true; btn.textContent="Checking…";
      const r=await api("verifyCode",{email:f.dataset.email,code});
      if(!r.ok){ btn.disabled=false; btn.textContent="Sign in";
        err.textContent=({wrong_code:`That code isn't right. ${r.triesLeft} tries left.`,code_expired:"That code expired. Go back and request a new one.",too_many_tries:"Too many tries. Request a new code.",no_access:"This email doesn't have access. Ask Jonathan to add you."})[r.error]||errText(r); return; }
      S.token=r.token; S.me=r.me; saveSession({token:r.token,expires:r.expires,me:r.me}); start();
    }
  };
}

/* ---------- data ---------- */
async function start(){
  renderShell(); $("main").innerHTML=`<div class="wrap"><div class="empty"><b>Loading…</b>Pulling the latest recon.</div></div>`;
  const r=await api("bootstrap"); if(!r.ok){ if(S.token) $("main").innerHTML=`<div class="wrap"><div class="empty"><b>Couldn't load</b>${esc(errText(r))}</div></div>`; return; }
  S.boot=r; S.me=r.me; if(!S.date || !r.days.some(d=>d.date===S.date)) S.date=r.days[0]&&r.days[0].date;
  render(); if(S.date) loadDay(S.date);
}
async function loadDay(d,force){
  if(!d) return; S.date=d;
  if(!S.days[d]||force){ if(!S.days[d]) render(); const r=await api("day",{date:d}); if(!r.ok){ S.err=errText(r); render(); return; } S.days[d]=r; }
  render();
}

/* ---------- Daily view ---------- */
function filterRows(rows){
  const q=S.q.toLowerCase();
  return rows.filter(r=>{
    const b=baseStatus(r), open=isOpen(r);
    if(S.filter==="open"&&!open) return false;
    if(S.filter==="missing"&&!(open&&b==="MISSING DEPOSIT")) return false;
    if(S.filter==="short"&&!(open&&b==="SHORT")) return false;
    if(S.filter==="over"&&!(open&&b==="OVER")) return false;
    if(S.filter==="bonly"&&!(open&&b==="BRINKS ONLY")) return false;
    if(S.filter==="ok"&&(open||r.status==="NO ACTIVITY")) return false;
    if(S.dm&&r.dm.trim()!==S.dm) return false;
    if(S.co&&r.company!==S.co) return false;
    if(q&&!(`${r.store} ${r.wz} ${r.dm} ${r.notes} ${r.note}`.toLowerCase().includes(q))) return false;
    return true;
  }).sort((a,b)=>(isOpen(b)-isOpen(a))||Math.abs(b.finalDiff)-Math.abs(a.finalDiff)||a.store.localeCompare(b.store));
}
function trendSvg(days){
  const d=days.slice(0,21).reverse(); if(d.length<2) return "";
  const W=600,H=96,gap=4,bw=(W-gap*(d.length-1))/d.length, mx=Math.max(1,...d.map(x=>x.open));
  const keys=[["missing","var(--red)"],["short","var(--orange)"],["over","var(--purple)"],["brinksOnly","var(--teal)"]];
  let bars="";
  d.forEach((x,i)=>{ let y=H-14; const xx=i*(bw+gap);
    keys.forEach(([k,c])=>{ const h=x[k]/mx*(H-22); if(h>0){ bars+=`<rect x="${xx.toFixed(1)}" y="${(y-h).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(h-1,1).toFixed(1)}" rx="2" fill="${c}"><title>${dayLabel(x.date)}: ${x.open} open · ${money(x.openAmt)}</title></rect>`; y-=h; } });
    if(!x.open) bars+=`<rect x="${xx.toFixed(1)}" y="${H-16}" width="${bw.toFixed(1)}" height="2" rx="1" fill="var(--green)"/>`;
    if(x.date===S.date) bars+=`<rect x="${(xx-1).toFixed(1)}" y="0" width="${(bw+2).toFixed(1)}" height="${H-12}" rx="3" fill="none" stroke="var(--accent)" stroke-width="1.5"/>`;
    bars+=`<rect x="${xx.toFixed(1)}" y="0" width="${bw.toFixed(1)}" height="${H}" fill="transparent" data-tday="${x.date}" style="cursor:pointer"/>`;
  });
  return `<svg viewBox="0 0 ${W} ${H-12}" preserveAspectRatio="none" role="img" aria-label="Open items per day">${bars}</svg>
    <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--muted)"><span>${dayLabel(d[0].date)}</span><span>Tap a bar to open that day</span><span>${dayLabel(d[d.length-1].date)}</span></div>`;
}
function viewDay(){
  const b=S.boot, i=b.days.findIndex(x=>x.date===S.date), sum=b.days[i];
  if(!sum) return `<div class="empty"><b>No recon yet</b>The first day shows up after the morning run.</div>`;
  const data=S.days[S.date], rows=data?data.rows:[];
  const dms=[...new Set(b.stores.map(s=>String(s.dm).trim()).filter(Boolean))].sort();
  const cos=[...new Set(b.stores.map(s=>s.company).filter(Boolean))].sort();
  const amt=k=>rows.filter(r=>isOpen(r)&&baseStatus(r)===k).reduce((s,r)=>s+Math.abs(r.finalDiff),0);
  const tile=(f,lab,n,meta,c)=>`<button class="tile" data-f="${f}" aria-pressed="${S.filter===f}"><span class="lab"><span class="sw" style="background:${c}"></span>${lab}</span><span class="big num">${n}</span><span class="meta num">${meta}</span></button>`;
  const list=filterRows(rows);
  return `<div class="top"><div><div class="eyebrow">BUSINESS DAY</div><h1>${dayLabel(S.date,true)}</h1>
      <p class="sub">${sum.matched} of ${sum.total} stores reconciled · ${sum.open?`<b style="color:var(--red)">${sum.open} open · ${money(sum.openAmt)}</b>`:"<b style='color:var(--green)'>all clear</b>"}</p></div>
    <div class="daynav"><button class="iconbtn" id="dprev" ${i>=b.days.length-1?"disabled":""} aria-label="Previous day">${IC.prev}</button>
      <select class="datesel" id="dsel" aria-label="Pick a day">${b.days.map(d=>`<option value="${d.date}" ${d.date===S.date?"selected":""}>${dayLabel(d.date)}${d.open?` · ${d.open} open`:""}</option>`).join("")}</select>
      <button class="iconbtn" id="dnext" ${i<=0?"disabled":""} aria-label="Next day">${IC.next}</button></div></div>
  ${lockBar()}
  <div class="tiles">
    ${tile("ok","Reconciled",`${sum.matched}<span class="muted" style="font-size:16px"> / ${sum.total}</span>`,`${Math.round(sum.matched/Math.max(1,sum.total)*100)}% of stores`,"var(--green)")}
    ${tile("missing","Missing deposit",sum.missing,data?money(amt("MISSING DEPOSIT")):"","var(--red)")}
    ${tile("short","Short",sum.short,data?money(amt("SHORT")):"","var(--orange)")}
    ${tile("over","Over",sum.over,data?money(amt("OVER")):"","var(--purple)")}
    ${tile("bonly","Bag, no cashout",sum.brinksOnly,data?money(amt("BRINKS ONLY")):"","var(--teal)")}
  </div>
  <div class="card trend"><div class="trend-h"><h3>Open items, last ${Math.min(21,b.days.length)} days</h3>
    <div class="legend"><span><i class="sw" style="background:var(--red)"></i>Missing</span><span><i class="sw" style="background:var(--orange)"></i>Short</span><span><i class="sw" style="background:var(--purple)"></i>Over</span><span><i class="sw" style="background:var(--teal)"></i>Bag, no cashout</span></div></div>
    ${trendSvg(b.days)}</div>
  <div class="toolbar">
    <div class="seg" role="group" aria-label="Filter">${FILTERS.map(([k,l])=>`<button data-f="${k}" aria-pressed="${S.filter===k}">${l}</button>`).join("")}</div>
    <label class="search">${IC.search}<input id="q" placeholder="Store, WZ #, DM, note" value="${esc(S.q)}" aria-label="Search"></label>
    ${dms.length>1?`<select class="pick" id="fdm" aria-label="DM"><option value="">All DMs</option>${dms.map(d=>`<option ${S.dm===d?"selected":""}>${esc(d)}</option>`).join("")}</select>`:""}
    ${cos.length>1?`<select class="pick" id="fco" aria-label="Company"><option value="">All companies</option>${cos.map(d=>`<option ${S.co===d?"selected":""}>${esc(d)}</option>`).join("")}</select>`:""}
  </div>
  <div class="tbl" role="table">
    <div class="th" role="row"><span>Store</span><span>DM</span><span class="r">RQ cashout</span><span class="r">Brinks</span><span class="r">Difference</span><span class="r">Status</span></div>
    ${!data?`<div class="empty"><b>Loading ${dayLabel(S.date)}…</b></div>`:list.length?list.map(rowHtml).join(""):`<div class="empty"><b>${S.filter==="open"?"Nothing open":"No stores match"}</b>${S.filter==="open"?"Every store reconciled for this day.":"Try another filter."}</div>`}
  </div>
  ${data&&list.length?`<p class="fine muted" style="margin:0 4px">${list.length} store${list.length===1?"":"s"} shown. Tap a store for its bags, cashouts and history.</p>`:""}`;
}
function rowHtml(r){
  const d=r.finalDiff;
  return `<button class="tr ${S.sel&&S.sel.wz===r.wz&&S.sel.date===r.date?"sel":""}" data-row="${r.date}|${r.wz}" role="row">
    <span class="st"><b>${esc(r.store)}</b><small>${esc(r.wz)} · ${esc(r.company)}</small></span>
    <span class="dm">${esc(r.dm)}</span>
    <span class="r num c-rq">${money(r.rq)}</span><span class="r num c-br">${money(r.brinks)}</span>
    <span class="r num c-diff ${d<-0.004?"neg":d>0.004?"pos":""}">${Math.abs(d)<0.005?"—":money(d,1)}</span>
    <span class="cell-st">${r.adj!==""||r.note?'<span class="adjdot" title="Has an adjustment or note"></span>':""}${pill(r)}</span></button>`;

/* ---------- Still open ---------- */
function viewOpen(){
  const c=S.boot.carry||[];
  const by={}; c.forEach(r=>(by[r.date]=by[r.date]||[]).push(r));
  const total=c.reduce((s,r)=>s+Math.abs(r.finalDiff),0);
  return `<div class="top"><div><div class="eyebrow">LAST 30 DAYS</div><h1>Still open</h1>

/* ---------- Combined deposit + extra-$ matcher (store panel) ---------- */
function bestSubset(cands, extra, tol){
  const c=cands.slice(0,14); let best=null, gap=Infinity;
  for(let m=1;m<(1<<c.length);m++){ let s=0, pick=[]; for(let i=0;i<c.length;i++) if(m&(1<<i)){ s+=c[i].need; pick.push(c[i]); }
    const g=Math.abs(s-extra); if(g<=tol && (g<gap-0.001 || (Math.abs(g-gap)<0.001 && pick.length<best.length))){ best=pick; gap=g; } }
  return best;
}
function allocHtml(r, hist, allocs){
  if(!S.me.canEdit || isLocked(r.date)) return "";
  const tol=S.boot.tolerance, extra=r.finalDiff;
  const own=(allocs||[]).filter(a=>a.depDate===r.date||a.date===r.date);
  const ids=[...new Set(own.map(a=>a.id))];
  let h=ids.length?`<div><div class="group-h"><h3>Combined / matched deposits</h3></div><div class="mini">${ids.map(id=>{ const it=own.filter(a=>a.id===id).length?(allocs.filter(a=>a.id===id)):[]; const dep=it[0];
    return `<div class="mini-r"><span><b>${id.startsWith("CD")?"Combined deposit":"Matched extra $"}</b> · ${esc(dep.reason)}${dep.excused?' <span class="pill p-ok">excused</span>':""}</span><button class="btn" data-undo="${esc(id)}">Undo</button>
      <small>${it.filter(a=>a.amount>0).map(a=>`${dayLabel(a.date)} ${money(a.amount)}`).join(" · ")} ← from ${dayLabel(dep.depDate)} · ${esc(dep.by)}</small></div>`; }).join("")}</div></div>`:"";
  if(extra<=tol || !hist) return h;
  const cands=hist.filter(x=>x.date<r.date && x.date>=addD(r.date,-14) && isOpen(x) && x.finalDiff<-tol && !isLocked(x.date))
    .map(x=>({date:x.date, need:Math.round(-x.finalDiff*100)/100, st:baseStatus(x)})).sort((a,b)=>a.date<b.date?-1:1);
  if(!cands.length) return h+`<div class="card" style="font-size:13px;color:var(--muted)">This store is ${money(extra)} over, but has no open short or missing days in the 2 weeks before. If it's a mistake, log an adjustment below.</div>`;
  const best=bestSubset(cands,extra,tol), run=[]; for(let i=cands.length-1;i>=0&&cands[i].st==="MISSING DEPOSIT";i--) run.unshift(cands[i]);
  h+=`<form class="form" id="cf"><h3>Extra ${money(extra)} on this day</h3>
    ${best?`<div class="suggest"><span>Matches <b>${best.map(c=>`${dayLabel(c.date)} (${(STATUS[c.st]||{}).label} ${money(c.need)})`).join(" + ")}</b>${Math.abs(best.reduce((t,c)=>t+c.need,0)-extra)>0.004?` · within $${tol}`:" exactly"}.</span>
      <button type="button" class="btn primary" id="applymatch" data-days="${best.map(c=>c.date).join(",")}">Apply match</button></div>`:""}
    <p class="fine" style="margin:0">Or treat it as <b>one deposit covering several days</b>. Pick the days it covers; money goes to the oldest day first and anything left stays on this day.</p>
    <div class="days">${cands.map(c=>`<label><input type="checkbox" value="${c.date}" ${run.some(x=>x.date===c.date)?"checked":""}> ${dayLabel(c.date)} <span class="muted">${(STATUS[c.st]||{}).label} ${money(c.need)}</span></label>`).join("")}</div>
    <label>Reason (required)<select id="c-r"><option value="">Choose a reason…</option>${REASONS.map(x=>`<option>${x}</option>`).join("")}</select></label>
    <p class="fine" style="margin:0">Store closed, Brinks missed pickup and safe malfunction are <b>excused</b> on the scorecard. Manager error counts as late.</p>
    <p class="err" id="c-err"></p><button class="btn" type="submit">Split as combined deposit</button></form>`;
  return h;
}
function bindAlloc(r){
  const sheet=$("sheet");
  sheet.querySelectorAll("[data-undo]").forEach(b=>b.onclick=async()=>{ b.disabled=true; const x=await api("undoAlloc",{id:b.dataset.undo}); if(!x.ok){ toast(errText(x)); b.disabled=false; return; } await afterEdit(r,"Undone"); });
  const am=$("applymatch"); if(am) am.onclick=async()=>{ am.disabled=true; const x=await api("allocate",{wz:r.wz,depDate:r.date,days:am.dataset.days.split(","),kind:"match"}); if(!x.ok){ toast(errText(x)); am.disabled=false; return; } await afterEdit(r,`Matched ${money(x.moved)}`); };
  const cf=$("cf"); if(cf) cf.onsubmit=async ev=>{ ev.preventDefault(); const days=[...cf.querySelectorAll("input[type=checkbox]:checked")].map(i=>i.value), reason=$("c-r").value;
    if(!days.length){ $("c-err").textContent="Pick the days this deposit covers."; return; } if(!reason){ $("c-err").textContent="Pick a reason."; return; }
    const btn=cf.querySelector("button[type=submit]"); btn.disabled=true;
    const x=await api("allocate",{wz:r.wz,depDate:r.date,days,reason,kind:"combo"}); btn.disabled=false;
    if(!x.ok){ $("c-err").textContent=errText(x); return; } await afterEdit(r,`Split ${money(x.moved)} across ${x.moves.length} day${x.moves.length===1?"":"s"}`); };
}

async function loadScore(){
  const n=S.scoreN||5, days=S.boot.days.slice(0,n).map(d=>d.date); if(!days.length) return;

function scoreRows(list,by){
  const m={};
  list.forEach(r=>{ if(r.status==="NO ACTIVITY") return;
    const k=by==="dm"?String(r.dm).trim()||"—":r.wz, o=m[k]=m[k]||{key:k,name:by==="dm"?k:`${r.store}`,sub:by==="dm"?"":r.wz+" · "+r.dm,miss:0,short:0,late:0,excused:0,days:0};
    o.days++; const fs=String(r.finalStatus), open=!/RESOLVED/.test(fs)&&/MISSING|SHORT|OVER|BRINKS ONLY/.test(fs), ar=String(r.adjReason||"");
    const combo=/Combined deposit/.test(ar), exc=combo&&EXCUSED.some(e=>ar.includes(e));
    if(open&&/MISSING/.test(fs)) o.miss++; else if(open&&/SHORT|OVER/.test(fs)) o.short++;
    else if(/late drop/.test(fs) || (combo&&!exc) || (/RESOLVED \(manual\)/.test(fs)&&/late/i.test(ar))) o.late++;
    if(exc) o.excused++;
  });
  return Object.values(m).map(o=>({...o,n:o.miss+o.short+o.late})).sort((a,b)=>b.n-a.n||b.miss-a.miss);
}
function viewScore(){
  const by=S.scoreBy||"store", n=S.scoreN||5, d=S.scoreData;
  const head=`<div class="top"><div><div class="eyebrow">ACCOUNTABILITY</div><h1>Deposit scorecard</h1><p class="sub">Who misses, shorts or deposits late, over the last ${n} business days. Excused combined deposits don't count.</p></div></div>
  <div class="toolbar"><div class="seg">${[["store","By store"],["dm","By DM"]].map(([k,l])=>`<button data-sby="${k}" aria-pressed="${by===k}">${l}</button>`).join("")}</div>
    <div class="seg">${[5,10,20].map(k=>`<button data-sn="${k}" aria-pressed="${n===k}">${k} days</button>`).join("")}</div></div>`;
  if(!d) return head+`<div class="tbl"><div class="empty"><b>Loading…</b></div></div>`;
  const rows=scoreRows(d.list,by), all=scoreRows(d.list,"store"), sum=k=>all.reduce((t,r)=>t+r[k],0), mx=Math.max(5,...rows.map(r=>r.n));
  const t=(lab,v,c)=>`<div class="tile"><span class="lab"><span class="sw" style="background:${c}"></span>${lab}</span><span class="big num">${v}</span></div>`;
  return head+`<div class="tiles t4">${t("No deposit",sum("miss"),"var(--red)")}${t("Short / over",sum("short"),"var(--orange)")}${t("Late",sum("late"),"var(--accent)")}${t("Excused",sum("excused"),"var(--green)")}</div>
  <div class="tbl">${rows.filter(r=>r.n||r.excused).map(r=>`<button class="tr score-g" ${by==="store"?`data-cal="${r.key}"`:`data-dmf="${esc(r.key)}"`}><span class="st"><b>${esc(r.name)}</b><small>${esc(r.sub||`${r.days} store-days`)}</small></span>
    <span class="sbar"><i style="width:${r.miss/mx*100}%;background:var(--red)"></i><i style="width:${r.short/mx*100}%;background:var(--orange)"></i><i style="width:${r.late/mx*100}%;background:var(--accent)"></i></span>
    <span class="r num"><b>${r.n}</b></span><span class="dm" style="font-size:12px">${r.miss} missing · ${r.short} short/over · ${r.late} late${r.excused?` · ${r.excused} excused`:""}</span></button>`).join("")||`<div class="empty"><b>Clean sheet</b>No misses, shorts or late deposits in this window.</div>`}</div>`;

function expTables(r,e){

  const open=x=>!/RESOLVED/.test(x.finalStatus)&&/MISSING|SHORT|OVER|BRINKS ONLY/.test(x.finalStatus);

      w.document.write(`<!doctype html><html><head><title>${esc(name)}</title><style>body{font:11px -apple-system,Helvetica,Arial,sans-serif;margin:24px;color:#1c1c1e}h1{font-size:18px;margin:0 0 2px}h2{font-size:14px;margin:18px 0 6px}table{border-collapse:collapse;width:100%}th,td{border-bottom:1px solid #ddd;padding:4px 6px;text-align:left}th{background:#f1f3f4}p{color:#6e6e73;margin:0}@page{size:landscape;margin:12mm}</style></head><body>
        <h1>Cash Recon Desk</h1><p>${esc(e.from)} to ${esc(e.to)} · exported by ${esc(S.me.name)} · ${new Date().toLocaleString()}</p>
        ${t.map(([n,h,rows])=>`<h2>${esc(n)} (${rows.length})</h2><table><tr>${h.map(x=>`<th>${esc(x)}</th>`).join("")}</tr>${rows.map(rw=>`<tr>${rw.map(c=>`<td>${esc(typeof c==="number"?c.toLocaleString("en-US",{maximumFractionDigits:2}):c)}</td>`).join("")}</tr>`).join("")}</table>`).join("")}</body></html>`);
      w.document.close(); setTimeout(()=>w.print(),300);
    }
  } finally { btn.disabled=false; btn.textContent="Export"; }
}

/* ---------- People & Access (requests, permissions, settings) ---------- */
async function loadReqs(){ const r=await api("requests"); if(r.ok){ S.reqs=r.requests; render(); } }
function viewPeople(){
  const u=S.users, q=S.reqs||[], pend=q.filter(x=>x.status==="Pending"), den=q.filter(x=>x.status==="Denied");
  const roles=(u&&u.roles)||["Admin","Editor","Super Viewer","DM Viewer","Store Viewer"];
  const perm=[["See dashboards, calendar, scorecard","✓","✓","All","Their DM","1 store"],["Export Excel, Google Sheet, PDF","✓","✓","All","Their DM","1 store"],["Log adjustments","✓","✓","—","—","—"],
    ["Apply matches and combined deposits","✓","✓","—","—","—"],["Close a day","✓","✓","—","—","—"],["Reopen a closed day","✓","—","—","—","—"],["Add people, change roles, settings","✓","—","—","—","—"]];
  return `<div class="top"><div><div class="eyebrow">ADMIN</div><h1>People &amp; access</h1><p class="sub">Who can sign in and what they see. Unchecking Active locks someone out right away.</p></div><button class="btn primary" id="uadd">Add person</button></div>
  ${pend.length?`<div><div class="group-h"><h2>Waiting for approval</h2><span>${pend.length}</span></div><div class="tbl">${pend.map(x=>`<div class="req"><div class="st"><b>${esc(x.name)}</b><small>${esc(x.email)} · ${esc(x.title||"")}${x.at?` · ${new Date(x.at).toLocaleDateString("en-US",{month:"numeric",day:"numeric"})}`:""}</small>
      <p style="margin:6px 0 0;font-size:13px">Wants: <span style="font-weight:600">${esc(x.wants||"—")}</span> · ${esc(x.reason)}</p></div>
      <div class="req-a"><select data-rrole="${esc(x.email)}">${roles.map(r=>`<option ${r==="Store Viewer"?"selected":""}>${r}</option>`).join("")}</select><input data-rscope="${esc(x.email)}" placeholder="Scope: DM name or WZ #s (blank = auto)" value="">
      <button class="btn primary" data-appr="${esc(x.email)}">Approve</button><button class="btn" data-deny="${esc(x.email)}">Deny</button></div></div>`).join("")}</div></div>`:""}
  <div><div class="group-h"><h2>People</h2><span>${u?u.users.length:""}</span></div>
  <div class="tbl">${!u?`<div class="empty"><b>Loading…</b></div>`:u.users.map(x=>`<button class="tr" data-user="${esc(x.email)}" style="grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) minmax(0,1fr) 90px">
    <span class="st"><b>${esc(x.name||x.email)}</b><small>${esc(x.email)}</small></span><span class="dm">${esc(x.role)}</span><span class="dm">${esc(x.scope||"auto")}</span>
    <span class="cell-st"><span class="pill ${x.active?"p-ok":"p-none"}">${x.active?"Active":"Off"}</span></span></button>`).join("")}</div></div>
  ${den.length?`<div><div class="group-h"><h2>Denied requests</h2><span>${den.length}</span></div><div class="tbl">${den.map(x=>`<div class="req"><div class="st"><b>${esc(x.name)}</b><small>${esc(x.email)} · denied by ${esc(x.by)}</small></div><div class="req-a"><button class="btn" data-reopen="${esc(x.email)}">Move back to pending</button></div></div>`).join("")}</div></div>`:""}
  <div><div class="group-h"><h2>What each role can do</h2></div><div class="tbl perm"><div class="pr ph"><span>Permission</span><span>Admin</span><span>Editor</span><span>Super</span><span>DM</span><span>Store</span></div>
    ${perm.map(r=>`<div class="pr"><span>${r[0]}</span>${r.slice(1).map(v=>`<span class="${v==="—"?"no":v==="✓"?"yes":"part"}">${v}</span>`).join("")}</div>`).join("")}</div></div>
  <div><div class="group-h"><h2>Settings</h2></div><form class="form" id="setf" style="max-width:520px"><div class="row2" style="grid-template-columns:1fr 1fr">
    <label>Variance tolerance ($)<input id="st-t" inputmode="decimal" value="${S.boot.tolerance}"></label><label>Safe limit ($)<input id="st-l" inputmode="numeric" value="${S.boot.safeLimit}"></label></div>
    <p class="fine" style="margin:0">Differences within the tolerance show as "Coins". New values apply from the next engine run (and when you re-run a day).</p><p class="err" id="st-err"></p><button class="btn primary" type="submit">Save settings</button></form></div>`;
}
function bindPeople(){
  const m=$("main");
  m.querySelectorAll("[data-appr]").forEach(b=>b.onclick=async()=>{ const e=b.dataset.appr; b.disabled=true;
    const r=await api("decide",{email:e,approve:true,role:m.querySelector(`[data-rrole="${e}"]`).value,scope:m.querySelector(`[data-rscope="${e}"]`).value});
    if(!r.ok){ toast(errText(r)); b.disabled=false; return; } S.reqs=r.requests; S.users=null; loadUsers(); toast("Approved — they've been emailed"); });
  m.querySelectorAll("[data-deny]").forEach(b=>b.onclick=async()=>{ const r=await api("decide",{email:b.dataset.deny,approve:false}); if(r.ok){ S.reqs=r.requests; render(); toast("Denied"); } });
  m.querySelectorAll("[data-reopen]").forEach(b=>b.onclick=async()=>{ const r=await api("decide",{email:b.dataset.reopen}); if(r.ok){ S.reqs=r.requests; render(); } });
  const sf=$("setf"); if(sf) sf.onsubmit=async ev=>{ ev.preventDefault(); const r=await api("settings",{tolerance:$("st-t").value,safeLimit:$("st-l").value});
    if(!r.ok){ $("st-err").textContent=errText(r); return; } S.boot.tolerance=r.tolerance; S.boot.safeLimit=r.safeLimit; S.safe=null; toast("Settings saved"); render(); };
}

/* ---------- Request access (sign-in page) ---------- */
function renderRequest(){
  $("root").innerHTML=`<div class="login"><form class="login-card" id="rf"><span class="nyc-logo" role="img" aria-label="NY Connection"></span>
    <div><h1>Request access</h1><p class="fine" style="margin-top:4px">An admin reviews every request. You'll get an email when you're approved.</p></div>
    <div class="field"><label for="r-n">Full name</label><input id="r-n" required autocomplete="name"></div>
    <div class="field"><label for="r-e">Work email</label><input id="r-e" type="email" required autocomplete="email" placeholder="name@wireless-zone.com"></div>
    <div class="field"><label for="r-t">Title</label><input id="r-t" placeholder="Store Manager, DM, Auditor…"></div>
    <div class="field"><label for="r-w">What do you need to see?</label><input id="r-w" placeholder="My store (Copiague), my district, all stores"></div>
    <div class="field"><label for="r-r">Why?</label><input id="r-r" required placeholder="Check my store's deposits each morning"></div>
    <button class="btn primary" type="submit">Send request</button><button class="btn" type="button" id="r-back">Back to sign in</button><p class="err" id="r-err" role="alert"></p></form></div>`;
  $("r-back").onclick=()=>renderLogin();
  $("rf").onsubmit=async ev=>{ ev.preventDefault(); const btn=$("rf").querySelector(".btn.primary"); btn.disabled=true;
    const r=await api("requestAccess",{name:$("r-n").value,email:$("r-e").value,title:$("r-t").value,wants:$("r-w").value,reason:$("r-r").value}); btn.disabled=false;
    if(!r.ok){ $("r-err").textContent=r.error==="domain"?"Use your @wireless-zone.com email.":r.error==="missing_fields"?"Add your name and a reason.":errText(r); return; }
    const msg={pending:"Request sent. You'll get an email once an admin approves it.",has_access:"This email already has access. Sign in instead.",denied:"This request wasn't approved. Contact Jonathan if you think that's a mistake."}[r.status];
    renderLogin(null,msg); };
}

/* ---------- bindings ---------- */
function bindView(){
  const m=$("main");
  m.querySelectorAll("[data-f]").forEach(x=>x.onclick=()=>{ S.filter=x.dataset.f; render(); });
  const q=$("q"); if(q) q.oninput=()=>{ S.q=q.value; const p=q.selectionStart; render(); const n=$("q"); n.focus(); n.setSelectionRange(p,p); };
  const fdm=$("fdm"); if(fdm) fdm.onchange=()=>{ S.dm=fdm.value; render(); };
  const fco=$("fco"); if(fco) fco.onchange=()=>{ S.co=fco.value; render(); };
  const ds=$("dsel"); if(ds) ds.onchange=()=>loadDay(ds.value);
  const i=S.boot.days.findIndex(x=>x.date===S.date);
  const pv=$("dprev"); if(pv) pv.onclick=()=>loadDay(S.boot.days[i+1].date);
  const nx=$("dnext"); if(nx) nx.onclick=()=>loadDay(S.boot.days[i-1].date);
  m.querySelectorAll("[data-tday]").forEach(x=>x.onclick=()=>loadDay(x.dataset.tday));
  m.querySelectorAll("[data-row]").forEach(x=>x.onclick=()=>{ const [d,w]=x.dataset.row.split("|"); rowSheet(d,w); });
  m.querySelectorAll("[data-store]").forEach(x=>x.onclick=()=>storeSheet(x.dataset.store));
  m.querySelectorAll("[data-user]").forEach(x=>x.onclick=()=>userSheet(S.users.users.find(u=>u.email===x.dataset.user)));
  const ua=$("uadd"); if(ua) ua.onclick=()=>userSheet(null);
  const lk=$("lockday"); if(lk) lk.onclick=()=>setLock(true);
  const ul=$("unlock"); if(ul) ul.onclick=()=>setLock(false);
  m.querySelectorAll("[data-safe]").forEach(x=>x.onclick=()=>safeSheet(x.dataset.safe));
  m.querySelectorAll("[data-sby]").forEach(x=>x.onclick=()=>{ S.scoreBy=x.dataset.sby; render(); });
  m.querySelectorAll("[data-sn]").forEach(x=>x.onclick=()=>{ S.scoreN=Number(x.dataset.sn); S.scoreData=null; render(); loadScore(); });
  m.querySelectorAll("[data-cal]").forEach(x=>x.onclick=()=>{ S.calWz=x.dataset.cal; S.calData=S.calData; go("cal"); if(!S.calData) loadCal(); });
  m.querySelectorAll("[data-dmf]").forEach(x=>x.onclick=()=>{ S.dm=x.dataset.dmf; S.filter="all"; go("day"); });
  const cw=$("calwz"); if(cw) cw.onchange=()=>{ S.calWz=cw.value; render(); };
  m.querySelectorAll("[data-calm]").forEach(x=>x.onclick=()=>{ S.calMonth=x.dataset.calm; S.calData=null; render(); loadCal(); });
  const xf=$("xf"); if(xf){ xf.onsubmit=ev=>{ ev.preventDefault(); runExport(); };
    xf.querySelectorAll("[data-xfmt]").forEach(b=>b.onclick=()=>{ readExp(); S.exp.fmt=b.dataset.xfmt; render(); });
    xf.querySelectorAll("[data-xr]").forEach(b=>b.onclick=()=>{ readExp(); const last=S.boot.days[0]?S.boot.days[0].date:ymd(new Date()); S.exp.to=last;
      S.exp.from=b.dataset.xr==="mtd"?last.slice(0,8)+"01":addD(last,-Number(b.dataset.xr)); render(); }); }
  if(S.view==="team") bindPeople();
  if(S.view==="stores"&&S.boot.days[0]&&!S.days[S.boot.days[0].date]) loadDay(S.boot.days[0].date).then(()=>{ S.view="stores"; render(); });
}

loadSession();
if(S.token) start(); else renderLogin();
</script>
